name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome
          - mobile-safari
          - samsung
          - ipad
          - android-tablet

    steps:
      - uses: actions/checkout@v4
      - name: Determine current branch
        id: branch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            branch="${{ github.head_ref }}"
          else
            branch="${{ github.ref_name }}"
          fi
          # Docker build arguments cannot safely contain a newline.
          branch="${branch//$'\n'/}"
          branch="${branch//$'\r'/}"
          echo "Using branch: $branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Clone music-server repo
        run: |
          git clone https://github.com/${{ github.repository_owner }}/music-server.git music-server
          cd music-server
          if git ls-remote --exit-code --heads origin "${{ steps.branch.outputs.name }}" >/dev/null 2>&1; then
            echo "Using frontend branch: ${{ steps.branch.outputs.name }}"
            git fetch origin "${{ steps.branch.outputs.name }}"
            git checkout -B "${{ steps.branch.outputs.name }}" "origin/${{ steps.branch.outputs.name }}"
          fi
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            music-server/package-lock.json
            package-lock.json
      - name: Install music-webui dependencies
        run: npm ci
      - name: Install music-server dependencies
        run: npm ci
        working-directory: music-server
      # This is only needed if the playwright version in the
      # package is different to the playwright version of the
      # docker image.  If they are aligned then everything is
      # ready to use.
      # - name: Run Playwright setup
      #   run: |
      #     if [ "${{ matrix.project }}" = "firefox" ]; then
      #       npx playwright install --with-deps firefox
      #     elif [ "${{ matrix.project }}" = "webkit" ]; then
      #       npx playwright install --with-deps webkit
      #     else
      #       npx playwright install --with-deps
      #     fi
      - name: Start backend
        run: |
          LOG_FILE="$RUNNER_TEMP/backend.log"
          npm run start:test > "$LOG_FILE" 2>&1 &
        working-directory: music-server
      - name: Start frontend
        run: |
          LOG_FILE="$RUNNER_TEMP/frontend.log"
          npm run build:test
          npm run start:test > "$LOG_FILE" 2>&1 &
      - name: Wait for backend to start
        run: |
          LOG_FILE="$RUNNER_TEMP/backend.log"
          EXPECTED='LOG [IndexerService] Finished test indexing'
          for i in $(seq 1 120); do
            if sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$LOG_FILE" 2>/dev/null |
              grep -Fq "$EXPECTED"; then
              echo "Backend startup message detected"
              exit 0
            fi
            echo "Waiting for backend startup message... attempt $i/120"
            sleep 1
          done
          echo "Backend did not emit the expected startup message within 120 seconds"
          exit 1
      - name: Wait for frontend to start
        run: |
          LOG_FILE="$RUNNER_TEMP/frontend.log"
          EXPECTED='http://localhost:8100'
          for i in $(seq 1 120); do
            if sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$LOG_FILE" 2>/dev/null |
              grep -Fq "$EXPECTED"; then
              echo "Frontend startup message detected"
              exit 0
            fi
            echo "Waiting for frontend startup message... attempt $i/120"
            sleep 1
          done
          echo "Frontend did not emit the expected startup message within 120 seconds"
          exit 1

      - name: Run Playwright tests
        run: npm run test -- --project=${{ matrix.project }}
        env:
          HOME: /root
      - name: Backend debugging logs
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/backend.log" ]; then
            tail -n 200 "$RUNNER_TEMP/backend.log" || true
          else
            echo "No backend.log found at $RUNNER_TEMP/backend.log"
          fi
      - name: Frontend debugging logs
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/frontend.log" ]; then
            tail -n 200 "$RUNNER_TEMP/frontend.log" || true
          else
            echo "No frontend.log found at $RUNNER_TEMP/frontend.log"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
