<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/icons/light/manifest.json" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/icons/dark/manifest.json" media="(prefers-color-scheme: dark)" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/light/apple-touch-icon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/dark/apple-touch-icon.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/light/favicon-32x32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/dark/favicon-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/light/favicon-16x16.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/dark/favicon-16x16.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/icons/light/favicon.ico" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icons/dark/favicon.ico" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Streamish Music" />
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Streamish Music Player</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
